<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="350" viewBox="0 0 1040 350" role="img" aria-labelledby="title desc"><title id="title">대학 캠퍼스 네트워크 설계 개념도</title><desc id="desc">프로젝트 문서의 주요 구역과 기술을 요약한 개념도이며 실제 회선 배치를 나타내지 않습니다.</desc><rect width="1040" height="350" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="36" y="49" fill="#f8fafc" font-size="25" font-weight="700">대학 캠퍼스 네트워크 설계·구축</text><text x="36" y="80" fill="#94a3b8" font-size="15">연결성 · 가용성 · 접근 통제 · 운영성</text><rect x="36" y="112" width="230" height="116" rx="12" fill="#1e293b" stroke="#334155"/><text x="52" y="150" fill="#e2e8f0" font-size="19" font-weight="700">본교 코어</text><text x="52" y="187" fill="#7dd3fc" font-size="13">OSPF · ABR · Stub / NSSA</text><rect x="282" y="112" width="230" height="116" rx="12" fill="#1e293b" stroke="#334155"/><text x="298" y="150" fill="#e2e8f0" font-size="19" font-weight="700">사용자·전산 구역</text><text x="298" y="187" fill="#7dd3fc" font-size="13">VLAN · HSRP · PVST</text><rect x="528" y="112" width="230" height="116" rx="12" fill="#1e293b" stroke="#334155"/><text x="544" y="150" fill="#e2e8f0" font-size="19" font-weight="700">DMZ·통신 경계</text><text x="544" y="187" fill="#7dd3fc" font-size="13">ASAv · GLBP · NAT / ACL</text><rect x="774" y="112" width="230" height="116" rx="12" fill="#1e293b" stroke="#334155"/><text x="790" y="150" fill="#e2e8f0" font-size="19" font-weight="700">분교·연구 연결</text><text x="790" y="187" fill="#7dd3fc" font-size="13">EIGRP / RIPv2 · GRE / IPsec</text><rect x="36" y="250" width="968" height="49" rx="10" fill="#172b40"/><text x="56" y="280" fill="#cbd5e1" font-size="16">운영 연계   SNMP · 중앙 로그 · 설정 백업 · 패킷 기반 장애 분석</text><text x="36" y="329" fill="#94a3b8" font-size="12">문서 기반 설계 개념도 · 실제 장비 및 회선 배치와 시험 증적은 상세 자료로 구분</text></g></svg>